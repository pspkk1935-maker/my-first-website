
<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>నా మొదటి Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 450px;
      width: 100%;
      padding: 35px 22px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      color: #dbeafe;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 25px;
      background: #38bdf8;
      color: #082f49;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
    }

    .button:hover {
      background: #7dd3fc;
    }

    footer {
      margin-top: 25px;
      color: #bfdbfe;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>నమస్కారం! 👋</h1>
    <p>ఇది నా మొదటి Website.</p>
    <p>నేను HTML మరియు GitHub నేర్చుకుంటున్నాను.</p>

    <a class="button" href="https://github.com/">
      Let's Learn!
    </a>

    <footer>
      నా మొదటి Web Development Project 🚀
    </footer>
  </main>
</body>
</html>
